# Database Connection Configuration
# ============================================================
# Thay đổi các giá trị bên dưới cho phù hợp với SQL Server của bạn
# ============================================================

# SQL Server Connection URL
# Format: jdbc:sqlserver://<server>:<port>;databaseName=<db>;encrypt=true;trustServerCertificate=true;
db.url=jdbc:sqlserver://localhost:1433;databaseName=PetShopDB;encrypt=true;trustServerCertificate=true;

# Credentials
db.username=sa
db.password=123456

# Connection Pool Settings (thường không cần thay đổi)
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=30000
